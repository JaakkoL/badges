name: Test with Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Python version from .python-version
        id: python_version
        run: |
          PY_VER=$(cat .python-version)
          echo "version=$PY_VER" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python_version.outputs.version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.5.25
        shell: bash

      - name: Run tests with coverage
        run: uv run pytest --cov
        shell: bash

      - name: Generate coverage badge
        run: uv run coverage-badge -f -q -o coverage.svg
        shell: bash

      - name: Generate badge and commit branch
        shell: bash
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git checkout --orphan badges
          git reset --hard
          git add coverage.svg
          git commit -m "Update coverage badge"
          git push --force origin badges:badges
